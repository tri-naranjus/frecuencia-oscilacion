<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRA-9000 • Analizador Cuántico</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020408;color:#7ec8e3;font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:999}
header{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid #0a3a5a;background:linear-gradient(90deg,#020c14,#040e1c);position:sticky;top:0;z-index:100}
.logo h1{font-size:1rem;letter-spacing:.3em;color:#00e5ff;text-shadow:0 0 10px #00e5ff}
.logo p{font-size:.6rem;letter-spacing:.2em;color:#3a7a9a}
.status{display:flex;gap:20px}
.status-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem}
.status-label{font-size:.5rem;color:#3a7a9a}
.status-val{color:#00e5ff;text-shadow:0 0 8px #00e5ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;max-width:1400px;margin:0 auto}
.panel{background:#040c14;border:1px solid #0a3a5a;border-radius:4px;padding:10px}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#00e5ff,transparent);opacity:.5}
.panel-title{font-size:.6rem;letter-spacing:.25em;color:#3a7a9a;text-transform:uppercase;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1a3a50}
canvas{display:block;width:100%;background:rgba(5,16,32,.5);border-radius:2px;margin-top:6px}
.full{grid-column:1/-1}
button{font-family:monospace;font-size:.6rem;padding:8px 12px;background:transparent;border:1px solid #0a3a5a;color:#7ec8e3;border-radius:2px;cursor:pointer;transition:all .2s;text-transform:uppercase}
button:hover{border-color:#00e5ff;color:#00e5ff;box-shadow:0 0 8px rgba(0,229,255,.3)}
button.active{border-color:#00ff88;color:#00ff88;background:rgba(0,255,136,.1);box-shadow:0 0 8px rgba(0,255,136,.3)}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.slider-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.6rem}
input[type=range]{flex:1;height:3px;background:#1a3a50;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:#00e5ff;border-radius:50%;box-shadow:0 0 6px #00e5ff}
.log{height:100px;overflow:auto;font-size:.55rem;color:#7ec8e3}
.log-entry{padding:2px 4px;border-left:2px solid #00e5ff;margin-bottom:2px}
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>QRA-9000</h1>
    <p>Analizador de Resonancia Cuántica</p>
  </div>
  <div class="status">
    <div class="status-item">
      <span class="status-label">FREQ</span>
      <span class="status-val" id="freqDisplay">432 Hz</span>
    </div>
    <div class="status-item">
      <span class="status-label">ENTROPÍA</span>
      <span class="status-val" id="entropyDisplay">0.0 bits</span>
    </div>
    <div class="status-item">
      <span class="status-label">ESTADO</span>
      <span class="status-val" id="stateDisplay">ESTABLE</span>
    </div>
  </div>
</header>

<div class="grid">
  <div class="panel">
    <div class="panel-title">Osciloscopio Cuántico</div>
    <canvas id="scope" width="500" height="250"></canvas>
  </div>

  <div class="panel">
    <div class="panel-title">Espectro Frecuencial</div>
    <canvas id="spectrum" width="500" height="250"></canvas>
  </div>

  <div class="panel">
    <div class="panel-title">Entropía Shannon & Bekenstein</div>
    <canvas id="entropy" width="500" height="250"></canvas>
  </div>

  <div class="panel">
    <div class="panel-title">Radar Cuántico</div>
    <canvas id="radar" width="500" height="250"></canvas>
  </div>

  <div class="panel full">
    <div class="panel-title">Controles</div>
    <div class="controls" id="modes">
      <button class="active" data-mode="sine">Seno</button>
      <button data-mode="square">Cuadrada</button>
      <button data-mode="chaos">Caos</button>
      <button data-mode="quantum">Cuántica</button>
    </div>
    <div class="slider-row">
      <span>Frecuencia:</span>
      <input type="range" id="freq" min="1" max="1000" value="432">
      <span id="freqVal">432 Hz</span>
    </div>
    <div class="slider-row">
      <span>Amplitud:</span>
      <input type="range" id="amp" min="10" max="100" value="60">
      <span id="ampVal">60%</span>
    </div>
  </div>

  <div class="panel full">
    <div class="panel-title">Log de Eventos</div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
const state={freq:432,amp:0.6,mode:'sine',t:0,entropy:0,bekenMax:100};
const ctxs={
  scope:document.getElementById('scope').getContext('2d'),
  spectrum:document.getElementById('spectrum').getContext('2d'),
  entropy:document.getElementById('entropy').getContext('2d'),
  radar:document.getElementById('radar').getContext('2d')
};

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function wave(t,f,a,m){const w=f*0.05;switch(state.mode){case'square':return a*Math.sign(Math.sin(w*t));case'chaos':return a*(0.5*Math.sin(w*t)+0.3*Math.sin(w*2.73*t+1.1)+0.2*Math.sin(w*5.17*t-0.4));case'quantum':return a*Math.sin(w*t)*Math.cos(w*0.618*t)*(1+0.2*Math.sin(w*3.14*t));default:return a*Math.sin(w*t)*(1+m*0.3*Math.sin(w*0.37*t))}}

function drawScope(){
  const c=ctxs.scope,W=c.canvas.width,H=c.canvas.height;
  c.clearRect(0,0,W,H);
  c.strokeStyle='rgba(0,58,90,.4)';c.lineWidth=0.5;
  for(let i=0;i<=10;i++){c.beginPath();c.moveTo(i*W/10,0);c.lineTo(i*W/10,H);c.stroke()}
  for(let i=0;i<=5;i++){c.beginPath();c.moveTo(0,i*H/5);c.lineTo(W,i*H/5);c.stroke()}

  c.strokeStyle='#00e5ff';c.lineWidth=2;c.shadowColor='#00e5ff';c.shadowBlur=8;
  c.beginPath();
  for(let x=0;x<W;x++){
    const y=H/2-wave(state.t-x*0.5,state.freq,state.amp*H*0.3,0.3)*H*0.3;
    x===0?c.moveTo(x,y):c.lineTo(x,y);
  }
  c.stroke();c.shadowBlur=0;
}

function drawSpectrum(){
  const c=ctxs.spectrum,W=c.canvas.width,H=c.canvas.height;
  c.clearRect(0,0,W,H);
  const bars=60;
  for(let i=0;i<bars;i++){
    const v=Math.abs(Math.sin(i*0.2+state.t*0.02)*Math.exp(-i*0.01));
    const bh=v*H*state.amp;
    const hue=180+(i/bars)*120;
    c.fillStyle=`hsla(${hue},100%,60%,.8)`;c.shadowColor=`hsl(${hue},100%,60%)`;c.shadowBlur=4;
    c.fillRect(i*W/bars+1,H-bh,W/bars-2,bh);
  }
  c.shadowBlur=0;
}

function drawEntropy(){
  const c=ctxs.entropy,W=c.canvas.width,H=c.canvas.height;
  c.clearRect(0,0,W,H);
  state.entropy=Math.sin(state.t*0.01)*50+50;
  const pct=state.entropy/state.bekenMax;

  // Bekenstein bar
  c.fillStyle='rgba(0,58,90,.5)';c.fillRect(20,50,W-40,30);
  c.fillStyle=pct>0.85?'#ff3355':pct>0.5?'#ffaa00':'#00ff88';
  c.fillRect(20,50,(W-40)*pct,30);c.shadowColor=c.fillStyle;c.shadowBlur=8;

  // Text
  c.fillStyle='#7ec8e3';c.font='bold .7rem monospace';c.textAlign='left';
  c.fillText('ENTROPÍA:',20,30);
  c.fillText(state.entropy.toFixed(1)+' / '+state.bekenMax.toFixed(0)+' bits',20,100);
  c.fillText('Límite Bekenstein: '+(pct*100).toFixed(0)+'%',20,130);

  if(pct>0.9){c.fillStyle='rgba(255,51,85,.3)';c.fillRect(0,0,W,H)}
  c.shadowBlur=0;
}

function drawRadar(){
  const c=ctxs.radar,W=c.canvas.width,H=c.canvas.height;
  c.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,r=80;

  c.strokeStyle='rgba(0,58,90,.6)';c.lineWidth=1.5;
  c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();

  for(let i=1;i<=3;i++){c.strokeStyle=`rgba(0,58,90,${.3+i*.1})`;c.lineWidth=.5;c.beginPath();c.arc(cx,cy,r*i/3,0,Math.PI*2);c.stroke()}

  const sweep=(state.t*0.02)%(Math.PI*2);
  c.strokeStyle='#00e5ff';c.lineWidth=2;c.shadowColor='#00e5ff';c.shadowBlur=6;
  c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+r*Math.cos(sweep),cy+r*Math.sin(sweep));c.stroke();

  for(let i=0;i<12;i++){const a=i*Math.PI/6;c.fillStyle='#00ff88';c.beginPath();c.arc(cx+r*0.7*Math.cos(a),cy+r*0.7*Math.sin(a),2,0,Math.PI*2);c.fill()}
  c.shadowBlur=0;
}

function addLog(msg='Evento detectado'){
  const log=document.getElementById('log');
  const entry=document.createElement('div');
  entry.className='log-entry';
  entry.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
  log.insertBefore(entry,log.firstChild);
  if(log.children.length>10)log.removeChild(log.lastChild);
}

function tick(){
  state.t++;
  drawScope();
  drawSpectrum();
  drawEntropy();
  drawRadar();
  document.getElementById('freqDisplay').textContent=state.freq+' Hz';
  document.getElementById('entropyDisplay').textContent=state.entropy.toFixed(1)+' bits';
  if(Math.random()<0.02)addLog('Resonancia detectada @ '+state.freq+'Hz');
  requestAnimationFrame(tick);
}

// Controles
document.getElementById('modes').addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON'){
    document.querySelectorAll('#modes button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    state.mode=e.target.dataset.mode;
  }
});

document.getElementById('freq').addEventListener('input',e=>{
  state.freq=+e.target.value;
  document.getElementById('freqVal').textContent=state.freq+' Hz';
});

document.getElementById('amp').addEventListener('input',e=>{
  state.amp=e.target.value/100;
  document.getElementById('ampVal').textContent=e.target.value+'%';
});

addLog('Sistema QRA-9000 iniciado');
tick();
</script>
</body>
</html>
